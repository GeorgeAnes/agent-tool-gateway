name: ci
on: [push, pull_request]
permissions:
  contents: read
# ubuntu-24.04 rather than ubuntu-latest: that label starts moving to 26.04 on 19 October 2026, which the pinned Playwright 1.56 predates
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: python -m pytest -q          # includes the golden attack matrix: the job fails if it changes
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t agent-tool-gateway .
